{% set name = "periodictable" %}
{% set version = "2.1.0" %}
{% set sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pyparsing >=3.0.0

tests:
  - python:
    imports:
      - periodictable
      - periodictable.density
    python_version:
      - ${{ python_min }}.*
      - "*"
    pip_check: true

about:
  home: https://github.com/python-periodictable/periodictable
  license: NIST-PD
  summary: 'Extensible periodic table for python'
  description: |
    The periodictable package provides an extensible periodic table
    of the elements prepopulated with data important to neutron and
    X-ray scattering experiments. With the elements pacakge you can
    compute the scattering potential of a compound at a given wavelength.
  repository: https://github.com/python-periodictable/periodictable
  documentation: https://periodictable.readthedocs.io/en/v{{ version }}

extra:
  recipe-maintainers:
    - bjodah
    - mrakitin
