{% set name = "periodictable" %}
{% set version = "2.1.0" %}
{% set sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python >=3.10
    - setuptools
  run:
    - python >=3.10
    - numpy
    - pyparsing>=3.0.0

test:
  imports:
    - periodictable
    - periodictable.density

about:
  home: https://github.com/python-periodictable/periodictable
  license: Public domain
  summary: 'Extensible periodic table for python'

  description: |
    The periodictable package provides an extensible periodic table
    of the elements prepopulated with data important to neutron and
    X-ray scattering experiments. With the elements pacakge you can
    compute the scattering potential of a compound at a given wavelength.
  doc_url: https://periodictable.readthedocs.io/en/v{{ version }}
  dev_url: https://github.com/python-periodictable/periodictable

extra:
  recipe-maintainers:
    - bjodah
    - mrakitin
