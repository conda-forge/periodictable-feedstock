context:
  name: "periodictable"
  version: "2.1.0"
  python_min: "3.10"
  sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pyparsing >=3.0.0

tests:
  - python:
    imports:
      - periodictable
      - periodictable.density
    pip_check: true

about:
  homepage: https://github.com/python-periodictable/periodictable
  summary: 'Extensible periodic table for python'
  description: |
    The periodictable package provides an extensible periodic table
    of the elements prepopulated with data important to neutron and
    X-ray scattering experiments. With the elements pacakge you can
    compute the scattering potential of a compound at a given wavelength.
  license: NIST-PD
  documentation: https://periodictable.readthedocs.io/en/v{{ version }}
  repository: https://github.com/python-periodictable/periodictable

extra:
  recipe-maintainers:
    - bjodah
    - mrakitin
